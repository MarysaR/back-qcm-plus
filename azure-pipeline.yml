trigger:
  branches:
    include:
      - develop
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: qcm_plus_variables

stages:
  - stage: Build
    displayName: 'Build & Checks'
    jobs:
      - job: Build
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Utiliser Node.js'

          - checkout: self
            displayName: 'Checkout back repo'

          - script: |
              git clone https://github.com/MarysaR/logic-qcm-plus.git ../logic-qcm-plus
              mkdir -p vendor
              cp -R ../logic-qcm-plus vendor/logic-qcm-plus
            displayName: 'Préparer vendor logic-qcm-plus'

          - script: |
              rm -f package-lock.json
              cp package.ci.json package.json
            displayName: 'Utiliser package.json pour CI'

          - script: npm install
            displayName: 'Installer les dépendances'

          - script: npm run build
            displayName: 'Compiler le projet'

          - script: npm run lint
            displayName: 'Lint'

          - script: npm run format:check
            displayName: 'Vérifier le formatage'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'dist'
              ArtifactName: 'drop'
            displayName: 'Publier artefact dist'

  - stage: Deploy_Test
    displayName: 'Deploy to Azure TEST'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployTest
        environment: qcm_plus_test
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'drop'
                    downloadPath: '$(System.DefaultWorkingDirectory)'
                  displayName: 'Télécharger artefact dist'

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'qcm-plus-devops-connection'
                    appName: 'qcm-plus-test'
                    package: '$(System.DefaultWorkingDirectory)/drop/dist'
                  displayName: 'Deploy to Azure WebApp TEST'

  - stage: Deploy_Prod
    displayName: 'Deploy to Azure PROD'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProd
        environment: qcm_plus_prod
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'drop'
                    downloadPath: '$(System.DefaultWorkingDirectory)'
                  displayName: 'Télécharger artefact dist'

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'qcm-plus-devops-connection'
                    appName: 'qcm-plus-prod'
                    package: '$(System.DefaultWorkingDirectory)/drop/dist'
                  displayName: 'Deploy to Azure WebApp PROD'
